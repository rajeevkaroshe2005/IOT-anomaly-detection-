version: '3.8'

networks:
  iot_network:
    driver: bridge
    name: iot_internal_network

services:
  # 1. Eclipse Mosquitto MQTT Message Broker (Authenticated)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto_broker
    restart: unless-stopped
    networks:
      - iot_network
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/password_file:/mosquitto/config/password_file
      - ./mosquitto/acl_file:/mosquitto/config/acl_file
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # 2. PostgreSQL Relational & Time-Series Database (Internal Network Only)
  postgres:
    image: postgres:16-alpine
    container_name: iot_postgres_db
    restart: unless-stopped
    networks:
      - iot_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Database is strictly isolated on iot_network (no host port 5432 exposed)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Real-Time Backend & ML Stream Processing Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iot_fastapi_backend
    restart: unless-stopped
    networks:
      - iot_network
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      - APP_NAME=${APP_NAME:-Cloud-Based IoT Sensor Monitoring & Anomaly Detection System}
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MQTT_PROVIDER=${MQTT_PROVIDER:-local}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174
      - SIMULATOR_AUTORUN=True
    # Optional: For running AWS Cloud Mode inside Docker, mount host certs directory (read-only):
    # volumes:
    #   - ./certs:/app/certs:ro
    ports:
      - "8000:8000"

  # 4. React 18 + Vite Industrial SCADA Web Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot_react_frontend
    restart: unless-stopped
    networks:
      - iot_network
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
