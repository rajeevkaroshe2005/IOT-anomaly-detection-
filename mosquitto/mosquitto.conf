# ==============================================================================
# Eclipse Mosquitto MQTT Broker Configuration
# ==============================================================================
# Security Policy: Anonymous access is strictly forbidden.
# All connecting clients must authenticate using credentials in password_file.
# Topic publish/subscribe authorization is strictly governed by acl_file.

# ------------------------------------------------------------------------------
# LOCAL / DEMONSTRATION ENVIRONMENT (Port 1883 with Password Auth)
# TLS is disabled for local Docker demonstration to avoid self-signed cert friction.
# ------------------------------------------------------------------------------
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl_file

# ------------------------------------------------------------------------------
# RECOMMENDED PRODUCTION CONFIGURATION (MQTT over TLS on Port 8883)
# In production cloud deployments, enable encrypted TLS communication on port 8883:
#
# listener 8883 0.0.0.0
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.3
# require_certificate false  # Set to true if Mutual TLS (mTLS) client certs are required
# ------------------------------------------------------------------------------

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
