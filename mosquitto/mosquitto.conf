# Mosquitto MQTT Production / Hardened Broker Configuration
# Anonymous access is strictly forbidden.
# All clients must authenticate with credentials matching password_file.
# Topic publish/subscribe capabilities are strictly enforced via acl_file.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl_file

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
