# Mosquitto MQTT Local Development Configuration
# WARNING: DEV ONLY — Anonymous access permitted for local prototyping without Docker or authentication.
# In staging/production, use mosquitto.conf with authenticated credentials.

listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
