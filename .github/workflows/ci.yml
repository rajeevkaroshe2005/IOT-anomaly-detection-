name: Industrial SCADA CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend API & ML Model Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fast Pipeline Diagnostics
        env:
          SECRET_KEY: ci_cd_test_secret_key_123456789
          ALGORITHM: HS256
          DATABASE_URL: sqlite:///./iot_sensor.db
        run: |
          python -c "import joblib; from backend.ml.ml_model import IsolationForestDetector; print('ML detector imports successfully')"
          python -c "from backend.services.predictive_service import PredictiveEngine; print('Predictive engine verified')"

  frontend-build:
    name: Frontend React & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Execute Vite Production Build
        working-directory: ./frontend
        run: npm run build
